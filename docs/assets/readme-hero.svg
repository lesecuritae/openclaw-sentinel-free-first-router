<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">OpenClaw Sentinel Free-First Router</title>
  <desc id="description">A prompt enters a small decider, which chooses the least costly capable configured model profile. Uncertain decisions use normal model resolution.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1730"/>
      <stop offset="1" stop-color="#153347"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#76e4b5"/>
      <stop offset="1" stop-color="#70c9ff"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#040c1a" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="32" fill="url(#background)"/>
  <circle cx="1110" cy="0" r="245" fill="#3b8c91" opacity=".16"/>
  <circle cx="25" cy="480" r="160" fill="#65e8b0" opacity=".07"/>

  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <rect x="70" y="58" width="180" height="36" rx="18" fill="#244853" stroke="#548d8b"/>
    <text x="160" y="82" text-anchor="middle" fill="#a3f7dc" font-size="14" font-weight="700" letter-spacing="1.5">OPENCLAW PLUGIN</text>

    <text x="70" y="168" fill="#f4fbff" font-size="60" font-weight="760" letter-spacing="-2">Sentinel</text>
    <text x="70" y="235" fill="url(#highlight)" font-size="58" font-weight="760" letter-spacing="-2">Free-First Router</text>
    <text x="74" y="290" fill="#bdd4e0" font-size="20">Choose a capable model before the turn.</text>
    <text x="74" y="321" fill="#91acbb" font-size="18">Passendes Modell vor dem Durchlauf wählen.</text>

    <rect x="70" y="373" width="520" height="46" rx="23" fill="#193948" stroke="#37646b"/>
    <circle cx="97" cy="396" r="5" fill="#7ce9bb"/>
    <text x="112" y="402" fill="#d8edf0" font-size="16" font-weight="600">Config-driven</text>
    <circle cx="260" cy="396" r="5" fill="#7ce9bb"/>
    <text x="275" y="402" fill="#d8edf0" font-size="16" font-weight="600">No prompt logs</text>
    <circle cx="455" cy="396" r="5" fill="#7ce9bb"/>
    <text x="470" y="402" fill="#d8edf0" font-size="16" font-weight="600">Fail-open</text>

    <g filter="url(#card-shadow)">
      <rect x="612" y="62" width="512" height="357" rx="26" fill="#f7fbfc"/>
    </g>
    <text x="648" y="105" fill="#5e7886" font-size="14" font-weight="750" letter-spacing="1.5">MODEL SELECTION / MODELLAUSWAHL</text>

    <rect x="648" y="134" width="146" height="68" rx="15" fill="#eaf2f4"/>
    <text x="721" y="161" text-anchor="middle" fill="#5b7580" font-size="13" font-weight="700">01 · START</text>
    <text x="721" y="186" text-anchor="middle" fill="#193c4a" font-size="19" font-weight="700">Request</text>

    <path d="M801 168h42" fill="none" stroke="#61bfae" stroke-width="4" stroke-linecap="round"/>
    <path d="m835 160 10 8-10 8" fill="none" stroke="#61bfae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="852" y="134" width="232" height="68" rx="15" fill="#ddf5e9" stroke="#8fd9bf"/>
    <text x="968" y="161" text-anchor="middle" fill="#477c69" font-size="13" font-weight="700">02 · CLASSIFY</text>
    <text x="968" y="186" text-anchor="middle" fill="#1b4c3a" font-size="19" font-weight="700">Small decider</text>

    <path d="M968 208v29" fill="none" stroke="#61bfae" stroke-width="4" stroke-linecap="round"/>
    <path d="m960 230 8 10 8-10" fill="none" stroke="#61bfae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="648" y="252" width="436" height="77" rx="16" fill="#17484a"/>
    <circle cx="685" cy="291" r="16" fill="#79e9b7"/>
    <path d="m678 291 5 5 10-11" fill="none" stroke="#17484a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="718" y="284" fill="#f3fffb" font-size="19" font-weight="740">Least costly capable profile</text>
    <text x="718" y="308" fill="#b6ded2" font-size="15">Günstigstes geeignetes Profil</text>

    <path d="M968 334v18" fill="none" stroke="#91a8af" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="648" y="385" fill="#637c86" font-size="15">Uncertain?</text>
    <text x="748" y="385" fill="#1c6168" font-size="15" font-weight="700">Use normal model resolution</text>
  </g>
</svg>
